services:
  postgres:
    ports: !override
      - "5433:5432"

  redis:
    ports: !override
      - "6380:6379"

  api:
    ports: !override
      - "8001:8000"
    environment:
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3002","http://127.0.0.1:3002","http://localhost:3004","http://127.0.0.1:3004","http://frontend:3000","https://localhost"]'

  frontend:
    ports: !override
      - "3004:3000"
    environment:
      VITE_API_URL: http://localhost:8001

  grafana:
    ports: !override
      - "3005:3000"
